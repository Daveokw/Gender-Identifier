name: Keep Streamlit App Awake

on:
  schedule:
    # This schedule runs the keep-alive every 6 hours
    - cron: "0 */6 * * *"
  
  # Allows you to trigger the action manually from GitHub's Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run keep-alive script
        # NOTE: If you deploy the app to a different URL, change it here!
        run: node keep_alive.js "https://gender-identifier.streamlit.app"
